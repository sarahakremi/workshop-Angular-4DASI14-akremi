<section class="card" id="notifications">
  <div class="icon">🔔</div>
  <div>
    <h2>Zone de notifications</h2>
    <p>Vous avez {{ notifList().length }} nouvelles notifications.</p>

    <button (click)="toggle()">
      {{ show() ? 'Masquer les notifications' : 'Afficher les notifications' }}
    </button>

    @if (show()) {
      @for (element of notifList(); track element) {
        <p class="notification">{{ element }}</p>
      }
    }
  </div>
</section>
